<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طموح | فحص ملفات الموقع</title><style>body{background:#0e1435;color:white;font:16px system-ui;margin:0;padding:24px}main{max-width:800px;margin:auto}.panel{background:#20244f;padding:22px;border-radius:20px;margin:14px 0}li{padding:6px;border-bottom:1px solid #454a7a}strong{color:#b5f4cb}.bad{color:#ffa6a6}button{background:#845dff;border:0;border-radius:12px;color:white;padding:12px 22px;font:inherit;cursor:pointer}a{color:#c5b8ff}</style><main><h1>🔎 فحص ملفات طموح</h1><p>صفحة تشخيص محلية للموقع، لا تجمع بيانات الطلاب ولا ترسلها لأحد.</p><div class="panel"><button id="run">إعادة الفحص</button> <span id="summary">جاري الفحص...</span><ul id="list"></ul></div><p>لو ظهرت ملفات ناقصة، ارفعها إلى نفس المجلد الموجود فيه <code>index.html</code>، واحتفظ بباقي ملفات الموقع الأصلية.</p><p><a href="./">الرجوع لطموح</a></p></main><script>
const files=['index.html','app.js','style.css','tmoh-v6.js','tmoh-study-content.js','tmoh-study.js','tmoh-tools.js','tmoh-flow.js','tmoh-v20.js','tmoh-v21.js','tmoh-v22.js','tmoh-v20.css','tmoh-v21.css','tmoh-v22.css','assets/tmoh-student.png','assets/tmoh-mountains.svg','sw.js'];
async function check(){document.querySelector('#summary').textContent='جاري الفحص...';const list=document.querySelector('#list');list.replaceChildren();let ok=0;for(const file of files){let good=false,code='';try{const response=await fetch('./'+file+'?check='+Date.now(),{cache:'no-store'});good=response.ok;code=String(response.status);if(good)ok++;}catch(e){code='خطأ اتصال'}const li=document.createElement('li');li.className=good?'':'bad';li.textContent=(good?'✅ ':'❌ ')+file+' ('+code+')';list.append(li)}document.querySelector('#summary').textContent=`الملفات المتاحة ${ok} من ${files.length}`;}
document.querySelector('#run').addEventListener('click',check);check();
</script></html>
